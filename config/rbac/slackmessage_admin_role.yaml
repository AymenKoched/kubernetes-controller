# This rule is not used by the project kubernetes-controller-interview itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over notifications.aymenkoched.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubernetes-controller-interview
    app.kubernetes.io/managed-by: kustomize
  name: slackmessage-admin-role
rules:
- apiGroups:
  - notifications.aymenkoched
  resources:
  - slackmessages
  verbs:
  - '*'
- apiGroups:
  - notifications.aymenkoched
  resources:
  - slackmessages/status
  verbs:
  - get
