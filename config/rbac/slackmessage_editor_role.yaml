# This rule is not used by the project kubernetes-controller-interview itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the notifications.aymenkoched.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubernetes-controller-interview
    app.kubernetes.io/managed-by: kustomize
  name: slackmessage-editor-role
rules:
- apiGroups:
  - notifications.aymenkoched
  resources:
  - slackmessages
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - notifications.aymenkoched
  resources:
  - slackmessages/status
  verbs:
  - get
